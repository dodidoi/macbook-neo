<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="nbBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#30d158"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <filter id="nbShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#nbBg)"/>
  
  <!-- Subtle white grid lines -->
  <g opacity="0.3" stroke="#ffffff" stroke-width="1">
    <line x1="18" y1="36" x2="82" y2="36" stroke-dasharray="2,2"/>
    <line x1="18" y1="52" x2="82" y2="52" stroke-dasharray="2,2"/>
    <line x1="18" y1="68" x2="82" y2="68" stroke-dasharray="2,2"/>
  </g>

  <!-- 4 Colored Bars (Official Apple Numbers: Orange, Yellow, Green, Cyan) -->
  <g filter="url(#nbShadow)">
    <!-- Bar 1: Orange -->
    <rect x="20" y="56" width="11" height="24" rx="3" fill="#ff9500"/>
    <rect x="20" y="56" width="11" height="5" rx="2" fill="#ffb340" opacity="0.8"/>
    <!-- Bar 2: Yellow -->
    <rect x="35" y="44" width="11" height="36" rx="3" fill="#ffd60a"/>
    <rect x="35" y="44" width="11" height="5" rx="2" fill="#ffe666" opacity="0.8"/>
    <!-- Bar 3: Green -->
    <rect x="50" y="32" width="11" height="48" rx="3" fill="#32d74b"/>
    <rect x="50" y="32" width="11" height="5" rx="2" fill="#70e582" opacity="0.8"/>
    <!-- Bar 4: Cyan/Teal -->
    <rect x="65" y="20" width="11" height="60" rx="3" fill="#00c7be"/>
    <rect x="65" y="20" width="11" height="5" rx="2" fill="#66ded8" opacity="0.8"/>
  </g>
  <!-- Base baseline -->
  <line x1="16" y1="80" x2="84" y2="80" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
</svg>
