<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="setbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="gearLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#setbg)"/>
  <g transform="translate(50,50)">
    <circle cx="0" cy="0" r="26" fill="url(#gearLight)"/>
    <!-- Gear teeth -->
    <rect x="-5" y="-32" width="10" height="64" rx="3" fill="url(#gearLight)"/>
    <rect x="-5" y="-32" width="10" height="64" rx="3" fill="url(#gearLight)" transform="rotate(45)"/>
    <rect x="-5" y="-32" width="10" height="64" rx="3" fill="url(#gearLight)" transform="rotate(90)"/>
    <rect x="-5" y="-32" width="10" height="64" rx="3" fill="url(#gearLight)" transform="rotate(135)"/>
    <circle cx="0" cy="0" r="12" fill="#475569"/>
  </g>
</svg>