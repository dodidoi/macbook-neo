<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="pgBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff9f0a"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <linearGradient id="nibMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldTip" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="pgShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- Background Squircle -->
  <rect x="5" y="5" width="90" height="90" rx="22" fill="url(#pgBg)"/>

  <!-- Document Paper Sheet with folded corner -->
  <g filter="url(#pgShadow)">
    <path d="M 24 18 L 60 18 L 76 34 L 76 78 C 76 81.5 73.5 84 70 84 L 24 84 C 20.5 84 18 81.5 18 78 L 18 24 C 18 20.5 20.5 18 24 18 Z" fill="#ffffff"/>
    <!-- Folded top-right corner -->
    <path d="M 60 18 L 60 34 L 76 34 Z" fill="#e2e8f0"/>
  </g>

  <!-- Text lines on paper -->
  <line x1="26" y1="40" x2="68" y2="40" stroke="#f97316" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  <line x1="26" y1="48" x2="68" y2="48" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="56" x2="58" y2="56" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="26" y1="64" x2="64" y2="64" stroke="#cbd5e1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Official Fountain Pen angled across the sheet -->
  <g transform="translate(56, 52) rotate(-42)" filter="url(#pgShadow)">
    <!-- Pen Barrel (Orange / Wood body) -->
    <path d="M -5 10 L 5 10 L 4 48 L -4 48 Z" fill="#c2410c"/>
    <rect x="-4" y="44" width="8" height="4" fill="#fde047" rx="1"/>
    <!-- Pen Grip (Black collar) -->
    <rect x="-5" y="2" width="10" height="8" fill="#1e293b" rx="1"/>
    <rect x="-5.5" y="0" width="11" height="2.5" fill="#fde047" rx="0.5"/>
    <!-- Metallic Fountain Pen Nib -->
    <path d="M 0 -22 L 5 0 L -5 0 Z" fill="url(#nibMetal)"/>
    <path d="M 0 -22 L 2 -10 L -2 -10 Z" fill="url(#goldTip)"/>
    <line x1="0" y1="-22" x2="0" y2="-6" stroke="#0f172a" stroke-width="0.8"/>
    <circle cx="0" cy="-6" r="1.2" fill="#0f172a"/>
  </g>
</svg>
